[project]
name = "agent-bridge-mcp"
version = "0.2.0"
description = "MCP server that lets one AI coding agent drive another: Claude Code and Codex desktop chats talk to each other on Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marchellino Ghorayeb" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "uiautomation>=2.0.29; sys_platform == 'win32'", "psutil>=7", "anyio>=4"]
keywords = ["mcp", "model-context-protocol", "claude-code", "codex", "multi-agent", "agent-to-agent", "ui-automation", "windows"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/EngMarchG/agent-bridge"
Issues = "https://github.com/EngMarchG/agent-bridge/issues"

[project.scripts]
agent-bridge-mcp = "agent_bridge:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent_bridge"]
